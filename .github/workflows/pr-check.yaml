name: pr-check

on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint-format-typecheck:
    name: linter, formatters
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        name: Install pnpm
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Execute pnpm
        run: pnpm install --frozen-lockfile

      - name: Execute Build
        run: pnpm build

      - name: Run linter
        run: pnpm lint:check

      - name: Run formatter
        run: pnpm format:check

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run svelte check
        run: pnpm svelte:check

  unit-tests:
    name: unit tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Execute pnpm
        run: pnpm install

      - name: Execute Build
        run: pnpm build

      - name: Run unit tests
        run: pnpm test:unit

  build-oci:
    name: build oci image
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.build.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - uses: axel7083/gh-extensions-actions/.github/actions/hermeto-prefetch@5481b4dc266473a8e6a85f112401eb33ab8f106e
        id: hermeto
        with:
          packages: '[{"type":"generic","path":"."},{"type":"pnpm","path":"."}]'

      - name: Build OCI
        id: build
        uses: axel7083/gh-extensions-actions/.github/actions/oci-build@5481b4dc266473a8e6a85f112401eb33ab8f106e
        with:
          skip-checkout: true
          extra-args: ${{ steps.hermeto.outputs.extra-args }}
